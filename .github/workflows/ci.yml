name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Build all targets
        run: cargo build --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Doc tests
        run: cargo test --locked --workspace --doc --all-features
      - name: Documentation
        run: cargo doc --no-deps

  baseline:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run illustrative interpreter baseline
        shell: bash
        run: |
          cargo run --release --example baseline -- 100000 | tee baseline.jsonl
          rustc --version > environment.txt
          cargo --version >> environment.txt
          uname -a >> environment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aad-baseline-linux
          path: |
            baseline.jsonl
            environment.txt
