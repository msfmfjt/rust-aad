[package]
name = "rust-aad-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Experimental reusable compiled graph and reverse-mode AD for numerical workloads"
readme = "README.md"
keywords = ["autodiff", "adjoint", "reverse-mode", "simulation"]
categories = ["science", "mathematics"]
publish = false

[lib]
name = "rust_aad_core"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
