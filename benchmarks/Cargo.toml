[package]
name = "rust-aad-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
rust-aad-core = { path = "..", features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stats_alloc = { version = "0.1.10", optional = true }

[features]
count-allocations = ["dep:stats_alloc"]

[lints.rust]
unsafe_code = "forbid"
